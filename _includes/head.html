<!DOCTYPE html>

{% unless site.noindex %}
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LY66QHYQSQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-LY66QHYQSQ');

  // Outbound link tracking: one 'outbound_click' event per click on a link to another site,
  // with link_platform (Spotify, Apple Music, YouTube, Fairsound, ...) for reporting.
  (function () {
    var platforms = [
      [/(^|\.)spotify\.com$|(^|\.)spotify\.link$/, 'Spotify'],
      [/(^|\.)music\.apple\.com$|(^|\.)itunes\.apple\.com$/, 'Apple Music'],
      [/(^|\.)music\.youtube\.com$/, 'YouTube Music'],
      [/(^|\.)youtube\.com$|(^|\.)youtu\.be$/, 'YouTube'],
      [/(^|\.)fairsound\.com$/, 'Fairsound'],
      [/(^|\.)bandcamp\.com$/, 'Bandcamp'],
      [/(^|\.)soundcloud\.com$/, 'SoundCloud'],
      [/(^|\.)tidal\.com$/, 'Tidal'],
      [/(^|\.)deezer\.com$/, 'Deezer'],
      [/(^|\.)amazon\.[a-z.]+$/, 'Amazon'],
      [/(^|\.)instagram\.com$/, 'Instagram'],
      [/(^|\.)facebook\.com$/, 'Facebook'],
      [/(^|\.)(twitter|x)\.com$/, 'X'],
      [/(^|\.)tiktok\.com$/, 'TikTok']
    ];
    function platformFor(host) {
      for (var i = 0; i < platforms.length; i++) if (platforms[i][0].test(host)) return platforms[i][1];
      return host.replace(/^www\./, '');
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a || !/^https?:$/.test(a.protocol)) return;
      var host = a.hostname.toLowerCase();
      if (host === location.hostname || host.replace(/^www\./, '') === location.hostname.replace(/^www\./, '')) return;
      gtag('event', 'outbound_click', {
        link_platform: platformFor(host),
        link_domain: host,
        link_url: a.href,
        link_text: (a.textContent || '').trim().slice(0, 100),
        transport_type: 'beacon'
      });
    }, true);
  })();
</script>
{% endunless %}
